server:
  port: 8081

spring:
  application:
    name: mentee-power-crm
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

gg:
  jte:
    templateLocation: classpath:/jte/
    developmentMode: true

logging:
  level:
    org.springframework.web: DEBUG
    ru.mentee.power.crm: DEBUG
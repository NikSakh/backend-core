server:
  port: 8081

spring:
  application:
    name: mentee-power-crm
  datasource:
    url: jdbc:postgresql://localhost:5433/crm
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  sql:
    init:
      mode: never
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

gg:
  jte:
    templateLocation: classpath:/jte/
    developmentMode: true

logging:
  level:
    org.springframework.web: DEBUG
    ru.mentee.power.crm: DEBUG

email:
  validation:
    base-url: ${EMAIL_VALIDATION_URL:http://localhost:8089}